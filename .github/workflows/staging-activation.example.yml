name: staging-activation-example
on:
  workflow_dispatch:
  push:
    branches: [staging]
permissions:
  contents: read
  deployments: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run discover:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  plan:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - run: echo "Generate and review the exact signed plan artifact"
  apply:
    if: ${{ false }} # Remove only after approving the exact plan digest.
    needs: plan
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - run: echo "Apply remains intentionally disabled in this template"
  verify:
    if: ${{ false }}
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - run: echo "Run smoke tests and capture evidence"
